name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC token for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Caudal.sln -c Release /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Caudal.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Caudal.sln -c Release --no-build -o artifacts/packages /p:ContinuousIntegrationBuild=true

      # Trusted publishing: exchanges this run's GitHub OIDC token for a
      # short-lived nuget.org API key — no long-lived secret stored anywhere.
      # Requires a matching trusted-publishing policy on nuget.org.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nicoseijas

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/packages/*.nupkg
          --title "${{ github.ref_name }}"
          --generate-notes
          --prerelease
