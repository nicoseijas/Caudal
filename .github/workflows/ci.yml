name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Caudal.sln -c Release

      - name: Test
        run: dotnet test Caudal.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7

  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Caudal.sln

      - name: Check for vulnerable packages
        run: |
          output=$(dotnet list Caudal.sln package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -iq "has the following vulnerable packages"; then
            echo "::error::Vulnerable package(s) detected."
            exit 1
          fi
